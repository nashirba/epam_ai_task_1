[project]
name = "pia"
version = "0.1.0"
description = "Personal Investment-Planning Assistant — KZ-resident multi-agent RAG+MCP capstone"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "litellm>=1.55",
  "weaviate-client>=4.9",
  "sentence-transformers>=3.0",
  "fastmcp>=0.4",
  "mcp>=1.0",
  "streamlit>=1.39",
  "langfuse>=4.0.0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pia"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "smoke: end-to-end smoke tests",
  "integration: requires Weaviate or external services",
  "adversarial: safety/jailbreak tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "ANN", "RUF", "BLE"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
