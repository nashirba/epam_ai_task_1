[project]
name = "weather-news-mcp-agent"
version = "1.0.0"
description = "Weather and News Agent with MCP (Model Context Protocol) integration"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.0",
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "mcp_servers", "settings"]
